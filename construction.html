<!DOCTYPE html>

  <link rel="stylesheet" href="style.css">
  <style>
    /* Construction page specific styles */
    .construction-main {
      text-align: center;
      padding: 24px 12px;
    }

    .construction-sign {
      display: inline-block;
      border-top: var(--border-bevel-light);
      border-left: var(--border-bevel-light);
      border-bottom: var(--border-bevel-dark);
      border-right: var(--border-bevel-dark);
      background-color: #ff70b7;
      padding: 20px 28px;
      margin: 16px auto;
      max-width: 520px;
    }

    .construction-title {
      font-family: var(--font-display);
      font-size: 36px;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: var(--shadow-hard);
      animation: blink 0.8s steps(1) infinite;
    }

    /* CSS construction worker — 4-frame stepped animation */
    .worker {
      width: 60px;
      height: 80px;
      margin: 16px auto;
      position: relative;
    }

    /* Head */
    .worker__head {
      width: 18px;
      height: 18px;
      background-color: #ffcc88;
      border: 1px solid #000;
      margin: 0 auto;
      position: relative;
    }

    /* Hard hat */
    .worker__hat {
      width: 26px;
      height: 8px;
      background-color: var(--yellow);
      border: 1px solid #000;
      margin: 0 auto;
      position: relative;
      top: 2px;
    }
    .worker__hat::before {
      content: '';
      display: block;
      width: 18px;
      height: 5px;
      background-color: var(--orange);
      border: 1px solid #000;
      margin: 0 auto;
      position: relative;
      top: -1px;
    }

    /* Body */
    .worker__body {
      width: 22px;
      height: 26px;
      background-color: #ff6600;
      border: 1px solid #000;
      margin: 0 auto;
    }

    /* Arms — animated */
    .worker__arms {
      position: relative;
      height: 0;
      top: -20px;
    }

    .worker__arm-left,
    .worker__arm-right {
      position: absolute;
      width: 14px;
      height: 6px;
      background-color: #ffcc88;
      border: 1px solid #000;
      top: 4px;
    }

    .worker__arm-left  { left: 6px;  transform-origin: right center; }
    .worker__arm-right { right: 6px; transform-origin: left center; }

    .worker__arm-left  { animation: arm-left  0.6s steps(2) infinite; }
    .worker__arm-right { animation: arm-right 0.6s steps(2) infinite; }

    /* Legs */
    .worker__legs {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 2px;
    }

    .worker__leg {
      width: 8px;
      height: 18px;
      background-color: #003399;
      border: 1px solid #000;
    }

    .worker__leg:first-child { animation: leg-left  0.6s steps(2) infinite; }
    .worker__leg:last-child  { animation: leg-right 0.6s steps(2) infinite; }

    /* Shovel / tool */
    .worker__tool {
      position: absolute;
      right: 2px;
      top: -10px;
      width: 4px;
      height: 28px;
      background-color: #888888;
      border: 1px solid #000;
      animation: tool-swing 0.6s steps(2) infinite;
      transform-origin: bottom center;
    }
    .worker__tool::after {
      content: '';
      display: block;
      width: 10px;
      height: 6px;
      background-color: #aaaaaa;
      border: 1px solid #000;
      position: relative;
      left: -3px;
      top: -1px;
    }

    @keyframes arm-left  { 0% { transform: rotate(-30deg); } 50% { transform: rotate(20deg); } }
    @keyframes arm-right { 0% { transform: rotate(20deg);  } 50% { transform: rotate(-30deg); } }
    @keyframes leg-left  { 0% { transform: skewX(-10deg); } 50% { transform: skewX(10deg);  } }
    @keyframes leg-right { 0% { transform: skewX(10deg);  } 50% { transform: skewX(-10deg); } }
    @keyframes tool-swing { 0% { transform: rotate(-20deg); } 50% { transform: rotate(20deg); } }

    .construction-msg {
      font-family: var(--font-display);
      font-size: 16px;
      font-style: italic;
      letter-spacing: 2px;
      margin: 12px 0 6px;
    }

    .construction-sub {
      font-family: var(--font-body);
      font-size: 13px;
      color: #ffffff;
      margin-bottom: 16px;
    }
  </style>
</head>
