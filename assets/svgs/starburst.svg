    <polygon points="14,-24 8,-10 4,-13 10,-22" fill="#00cc00" stroke="#000000" stroke-width="1"/>
    <polygon points="24,-14 13,-8 12,-4 20,-8" fill="#00cc00" stroke="#000000" stroke-width="1"/>
    <polygon points="28,0 12,3 8,0 12,-3" fill="#00cc00" stroke="#000000" stroke-width="1"/>
    <polygon points="24,14 10,8 12,4 20,8" fill="#00cc00" stroke="#000000" stroke-width="1"/>
    <polygon points="14,24 8,12 4,13 10,22" fill="#00cc00" stroke="#000000" stroke-width="1"/>
    <polygon points="0,28 -3,12 0,8 3,12" fill="#00cc00" stroke="#000000" stroke-width="1"/>
    <polygon points="-14,24 -8,10 -4,13 -10,22" fill="#00cc00" stroke="#000000" stroke-width="1"/>
    <polygon points="-24,14 -10,8 -12,4 -20,8" fill="#00cc00" stroke="#000000" stroke-width="1"/>
