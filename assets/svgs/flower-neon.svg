<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- 8-petal spiky flower, flat fill, no filters -->
  <!-- Petals via polygons rotated around center -->
  <g transform="translate(40,40)">
    <!-- Spike petals -->
    <polygon points="0,-38 6,-18 0,-12 -6,-18" fill="#ff00ff" stroke="#000000" stroke-width="1"/>
    <polygon points="27,-27 13,-10 8,-16 18,-26" fill="#ff00ff" stroke="#000000" stroke-width="1"/>
    <polygon points="38,0 18,6 12,0 18,-6" fill="#ff00ff" stroke="#000000" stroke-width="1"/>
    <polygon points="27,27 10,13 16,8 26,18" fill="#ff00ff" stroke="#000000" stroke-width="1"/>
    <polygon points="0,38 -6,18 0,12 6,18" fill="#ff00ff" stroke="#000000" stroke-width="1"/>
    <polygon points="-27,27 -18,10 -12,16 -18,26" fill="#ff00ff" stroke="#000000" stroke-width="1"/>
    <polygon points="-38,0 -18,-6 -12,0 -18,6" fill="#ff00ff" stroke="#000000" stroke-width="1"/>
    <polygon points="-27,-27 -10,-13 -16,-8 -26,-18" fill="#ff00ff" stroke="#000000" stroke-width="1"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="10" fill="#ffff00" stroke="#000000" stroke-width="1"/>
    <circle cx="0" cy="0" r="5" fill="#ff6600" stroke="none"/>
  </g>
</svg>
