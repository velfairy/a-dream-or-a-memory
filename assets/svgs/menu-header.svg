<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 60" width="960" height="60" preserveAspectRatio="none">
  <!-- Background -->
  <rect width="960" height="60" fill="#f4a0c8"/>

  <!-- Top border lines -->
  <line x1="0" y1="2" x2="960" y2="2" stroke="#cc1870" stroke-width="2"/>
  <line x1="0" y1="6" x2="960" y2="6" stroke="#cc1870" stroke-width="1"/>

  <!-- Bottom border lines -->
