  <rect x="16"  y="9" width="4" height="4" fill="#cc1870"/>
  <rect x="24"  y="9" width="4" height="4" fill="#cc1870"/>
  <rect x="32"  y="9" width="4" height="4" fill="#cc1870"/>
  <rect x="40"  y="9" width="4" height="4" fill="#cc1870"/>
  <rect x="48"  y="9" width="4" height="4" fill="#cc1870"/>
  <rect x="56"  y="9" width="4" height="4" fill="#cc1870"/>
  <rect x="64"  y="9" width="4" height="4" fill="#cc1870"/>
  <rect x="72"  y="9" width="4" height="4" fill="#cc1870"/>
  <rect x="80"  y="9" width="4" height="4" fill="#cc1870"/>
  <rect x="88"  y="9" width="4" height="4" fill="#cc1870"/>
  <rect x="96"  y="9" width="4" height="4" fill="#cc1870"/>
  <rect x="104" y="9" width="4" height="4" fill="#cc1870"/>
  <rect x="112" y="9" width="4" height="4" fill="#cc1870"/>
  <rect x="120" y="9" width="4" height="4" fill="#cc1870"/>
</svg>
