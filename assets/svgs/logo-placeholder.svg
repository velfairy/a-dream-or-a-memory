<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <!-- Yellow swoosh arc -->
  <path d="M 30 90 C 10 40, 60 10, 160 30 C 260 50, 300 80, 280 100" fill="none" stroke="#f5d84e" stroke-width="4" stroke-linecap="round"/>

  <!-- Line 1: "A dream" in pink -->
  <text
    x="175" y="52"
    font-family="'Arial Rounded MT Bold', 'Nunito', Arial, sans-serif"
    font-size="36"
    font-weight="bold"
    text-anchor="middle"
    fill="#f07a9a"
    letter-spacing="1"
  >A dream</text>

  <!-- Line 2: "Or" in blue/purple -->
  <text
    x="105" y="92"
    font-family="'Arial Rounded MT Bold', 'Nunito', Arial, sans-serif"
    font-size="36"
    font-weight="bold"
    text-anchor="middle"
    fill="#8fa8d8"
    letter-spacing="1"
  >Or</text>

  <!-- Line 2: "a memory" in yellow -->
  <text
    x="235" y="92"
    font-family="'Arial Rounded MT Bold', 'Nunito', Arial, sans-serif"
    font-size="36"
    font-weight="bold"
    text-anchor="middle"
    fill="#f5d84e"
    letter-spacing="1"
  >a memory</text>
</svg>
