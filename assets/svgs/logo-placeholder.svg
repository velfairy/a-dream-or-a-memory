<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="220" height="80">
  <!-- Oval background -->
  <ellipse cx="110" cy="40" rx="106" ry="37" fill="#000000"/>
  <!-- Outer border -->
  <ellipse cx="110" cy="40" rx="106" ry="37" fill="none" stroke="#ff00ff" stroke-width="3"/>
  <!-- Inner border -->
  <ellipse cx="110" cy="40" rx="100" ry="31" fill="none" stroke="#ff00ff" stroke-width="1"/>

  <!-- Logo text -->
  <text
    x="110" y="33"
    font-family="Impact, Arial Black, sans-serif"
    font-size="20"
    font-style="italic"
    font-weight="bold"
    text-anchor="middle"
    fill="#ff00ff"
    letter-spacing="3"
  >YOUR NAME</text>

  <!-- Hard drop shadow simulation on tagline -->
  <text
    x="112" y="56"
    font-family="Impact, Arial Black, sans-serif"
    font-size="13"
    font-style="italic"
    text-anchor="middle"
    fill="#000000"
  >.com</text>
  <text
    x="110" y="54"
    font-family="Impact, Arial Black, sans-serif"
    font-size="13"
    font-style="italic"
    text-anchor="middle"
    fill="#00cccc"
  >.com</text>

  <!-- TM badge -->
  <text x="196" y="20" font-family="Arial, sans-serif" font-size="9" fill="#ffff00">™</text>
</svg>
